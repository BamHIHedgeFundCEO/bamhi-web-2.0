name: BamHI Inflection Screener 🎯

on:
  schedule:
    # 每週六 UTC 02:00（美股週五收盤後）
    - cron: '0 2 * * 6'
  workflow_dispatch:

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # EDGAR 回應快取（24h TTL 由程式控制；跨 run 重用降低呼叫量）
      - name: Restore EDGAR cache
        uses: actions/cache@v4
        with:
          path: cache/edgar
          key: edgar-cache-${{ github.run_id }}
          restore-keys: |
            edgar-cache-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r inflection_screener/requirements.txt

      - name: Run tests
        run: python -m pytest inflection_screener/tests -q

      - name: Run screener
        env:
          EDGAR_UA: ${{ secrets.EDGAR_UA }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m inflection_screener.src.main

      - name: Upload CSV artifacts
        uses: actions/upload-artifact@v4
        with:
          name: screen-results
          path: output/*.csv
          retention-days: 90

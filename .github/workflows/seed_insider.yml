name: Daily Insider Seed

on:
  schedule:
    - cron: '0 6 * * *'   # 每天 06:00 UTC (美東 02:00 AM)
  workflow_dispatch:        # 也可手動觸發

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install supabase edgartools pandas python-dotenv

      - name: Run insider seed
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python seed_insider.py

name: Dual Pool Stage 1 + Stage 2

on:
  schedule:
    # 每日 22:00 UTC（美東收盤後；06:00 TPE 次日）— §8.1
    - cron: '0 22 * * *'
  workflow_dispatch:   # 手動觸發（冷啟動、除錯用）

jobs:
  stage1:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # ── dual_pool 狀態 cache（Actions cache）─────────────────────────
      # 涵蓋 data/dual_pool/：ohlcv parquet 快取 + cik_cache.json + data_gap.json。
      # processed_accessions 已移至 Supabase edgar_processed 表（跨部署持久），
      # 不再依賴 Actions cache 維持冪等（cache 被清理仍冪等，但 stage2 不再重回補 90 天）。
      # key 以 run_number 輪換（每次 run 必為 miss → 存今晚新 cache）；
      # restore-keys 前綴匹配還原最近一晚 cache → 「還原昨晚 + 存今晚」。
      - name: Restore dual_pool cache
        uses: actions/cache@v4
        with:
          path: data/dual_pool
          key: dual-pool-${{ runner.os }}-${{ github.run_number }}
          restore-keys: |
            dual-pool-${{ runner.os }}-
            ohlcv-${{ runner.os }}-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            yfscreen \
            yfinance \
            supabase \
            pandas \
            pyarrow \
            pydantic \
            requests \
            python-dotenv

      # ── Stage 1 幂等性：
      #    storage.py upsert watchpool（ON CONFLICT DO UPDATE）
      #    storage.py upsert universe_snapshot（ON CONFLICT DO UPDATE）
      #    重跑同一天不會產生重複列。
      - name: Run Stage 1 (L0 + L1)
        id: stage1
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python -m data_pipeline.dual_pool.run_stage1

      # ── Stage 2：觸發 Render 執行（SEC 封鎖 Actions IP，Render IP 可達）
      #    GEMINI_API_KEY / NVIDIA_NIM_API_KEY / EDGAR_USER_AGENT 已移到 Render env，
      #    此處不再傳遞。
      #    poll 每 60s 打一次 status → 同時保活 Render 免費層防 spin-down 殺掉背景工作。
      - name: Trigger Stage 2 on Render (L2 EDGAR + LLM extract)
        env:
          RENDER_API_URL:          ${{ secrets.RENDER_API_URL }}
          DUAL_POOL_TRIGGER_TOKEN: ${{ secrets.DUAL_POOL_TRIGGER_TOKEN }}
        run: |
          set -e

          echo "[stage2] Triggering Render stage2..."
          HTTP_CODE=$(curl -s -o /tmp/trigger_resp.json -w "%{http_code}" \
            -X POST "${RENDER_API_URL}/api/dual-pool/run-stage2" \
            -H "X-Trigger-Token: ${DUAL_POOL_TRIGGER_TOKEN}" \
            -H "Content-Type: application/json")
          echo "[stage2] trigger HTTP ${HTTP_CODE}: $(cat /tmp/trigger_resp.json)"
          if [ "${HTTP_CODE}" != "202" ]; then
            echo "[stage2] ERROR: trigger failed (expected 202, got ${HTTP_CODE})"
            exit 1
          fi

          TIMEOUT=3600   # 60 分鐘逾時（首次 90 日回補較久；每晚增量遠短於此）
          ELAPSED=0
          POLL_INTERVAL=60

          while [ "${ELAPSED}" -lt "${TIMEOUT}" ]; do
            sleep "${POLL_INTERVAL}"
            ELAPSED=$((ELAPSED + POLL_INTERVAL))

            STATUS_JSON=$(curl -s "${RENDER_API_URL}/api/dual-pool/stage2-status")
            STATUS=$(echo "${STATUS_JSON}" | python3 -c \
              "import sys,json; print(json.load(sys.stdin).get('status',''))" 2>/dev/null || echo "")
            echo "[stage2] elapsed=${ELAPSED}s status=${STATUS}"

            if [ "${STATUS}" = "done" ]; then
              echo "[stage2] DONE. Result summary:"
              echo "${STATUS_JSON}" | python3 -c \
                "import sys,json; r=json.load(sys.stdin).get('result') or {}; [print(f'  {k}: {v}') for k,v in r.items()]"
              exit 0
            elif [ "${STATUS}" = "failed" ]; then
              ERR=$(echo "${STATUS_JSON}" | python3 -c \
                "import sys,json; print(json.load(sys.stdin).get('error','(no error message)'))" 2>/dev/null || echo "")
              echo "[stage2] FAILED: ${ERR}"
              exit 1
            fi
          done

          echo "[stage2] ⚠ TIMEOUT after ${TIMEOUT}s — stage2 仍在 Render 背景執行"
          # 逾時是良性的：stage2 冪等、可續跑，已完成批的 events 已落 Supabase，
          # 下輪從斷點續。stage3 用當下 events 快照計分（不依賴 stage2 完成）。
          # 因此逾時 exit 0，不讓整個 nightly job 假性標紅——真正失敗（trigger 非 202、
          # status=failed）在上面已各自 exit 1，仍會正確標紅。
          exit 0

      # ── Stage 3：L3 計分卡（GitHub Actions 上跑，yfinance 無 SEC 封鎖問題）
      #    stage2 done/timeout/partial 都照跑——scores 以當下 events 快照計算（冪等）。
      #    continue-on-error: false → 若計分炸掉整個 run 失敗，保留告警可見性。
      - name: Run Stage 3 (L3 scoring + veto + Gate)
        # stage2 失敗/逾時也跑（用已有 events），但 stage1（checkout/安裝含在其前置）
        # 失敗就不跑——always() 會在 checkout 炸掉時也觸發，產生噪音 run 與誤報。
        # 注意 !cancelled() 必須顯式寫，否則隱含 success() 會讓 stage2 失敗時跳過本步。
        if: ${{ !cancelled() && steps.stage1.outcome == 'success' }}
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DISCORD_WEBHOOK_URL:  ${{ secrets.DISCORD_WEBHOOK_URL }}
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          pip install --upgrade pip
          pip install yfinance supabase pandas httpx python-dotenv 2>/dev/null | tail -1
          python -m data_pipeline.dual_pool.run_stage3
